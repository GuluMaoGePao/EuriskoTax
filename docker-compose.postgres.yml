# =============================================================================
# EuriskoTax 本地 PostgreSQL 演练环境（生产等价性验证专用）
#
# 为什么需要它：
#   本地日常开发跑的是 SQLite（server/prisma/dev.db），而线上是 PostgreSQL，
#   由容器启动命令 `npx prisma migrate deploy` 建表。这中间有一类问题
#   「本地怎么测都是绿的、推上线才炸」——例如：改了 schema 忘了生成迁移、
#   迁移 SQL 在 PG 上语法/约束不兼容、字段类型在 PG 下行为不同。
#   本容器就是用来在推之前把这类问题在本地复现出来（npm run verify:pg）。
#
# 用法：
#   npm run verify:pg              # 起容器 → 迁移 → 种内容 → 跑完整 68 项 e2e 门禁
#   npm run verify:pg:fresh        # 先销毁数据卷（等价「全新库首部署」场景）再跑
#   docker compose -f docker-compose.postgres.yml down -v   # 手动彻底清理
#
# 注意：
#   - 这是**一次性演练库**，只放测试数据，不要往里放任何真实数据；
#   - 端口用 55432 而非 5432，避免与本机已安装的 PostgreSQL 冲突；
#   - 容器数据存在命名卷 pg_drill_data 里，删卷即彻底重置。
# =============================================================================
services:
  pg-drill:
    image: postgres:16-alpine
    container_name: euriskotax-pg-drill
    environment:
      POSTGRES_USER: eurisko
      POSTGRES_PASSWORD: eurisko_drill
      POSTGRES_DB: euriskotax_drill
      # 固定 UTC，避免本机时区影响迁移/时间字段断言
      TZ: UTC
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurisko -d euriskotax_drill"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pg_drill_data:/var/lib/postgresql/data

volumes:
  pg_drill_data:
